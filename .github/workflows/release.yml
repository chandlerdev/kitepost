name: Release build

# Builds the backend and the web app on GitHub's machines and attaches them to a
# GitHub Release, which the server downloads with deploy/deploy.sh instead of
# building on itself. Nothing is built for a plain push - only for a version tag:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Ports, database, logins and keys are NOT in the build: the backend reads them from
# kitepost_backend/.env on the server when it starts. The one thing baked into the web
# app is the path it is served under (BASE_PATH below), because Next.js needs it at build time.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build backend (runs the unit tests)
        working-directory: backend
        run: mvn -B -q package

      - name: Collect backend jar
        run: cp backend/target/kitepost-backend.jar backend.jar

      # NEXT_OUTPUT standalone gives a self-contained server.js with the node_modules it needs.
      # The static files and public/ are copied in beside it, which standalone leaves out.
      # Served at https://<domain>/kitepost, so the build needs that base path. Change it with
      # a repository variable named BASE_PATH (Settings > Secrets and variables > Actions > Variables).
      - name: Build web app
        working-directory: frontend
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH || '/kitepost' }}
        run: |
          npm ci
          npm run build
          test -f .next/standalone/server.js
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/
          if [ -d public ]; then cp -r public .next/standalone/; fi

      - name: Package web app
        run: tar -czf frontend.tar.gz -C frontend/.next/standalone .

      - name: Keep the files on the run (manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: |
            backend.jar
            frontend.tar.gz

      - name: Publish the Release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend.jar
            frontend.tar.gz
