# =====================================================================================================
# Backend settings. This file is the same on every site and is built into the jar on GitHub.
# The SITE SETTINGS are read from environment variables, which on the server come from
#     kitepost_backend/.env      (copy of .env.example; git-ignored, never committed)
# After changing that file:  pm2 restart kitepost-backend --update-env     (no rebuild needed)
#
#                      local (testing)                     live server
#   PORT               8081                                8087
#   DATABASE_URL       jdbc:mysql://localhost:3306/kitepost?createDatabaseIfNotExist=true&...
#   site address       http://localhost:3000               https://jjlltdnext.desss-portfolio.com/kitepost
# =====================================================================================================
spring.application.name=kitepost

# ---------- SITE SETTINGS (set in .env on every site) ----------
server.port=${PORT:8080}
# jdbc:mysql://host:3306/kitepost?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# createDatabaseIfNotExist=true creates the (empty) database on first start when the user is allowed to
# (root, or a user granted on kitepost.*). Flyway then creates the tables. PostgreSQL does not have this option.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/kitepost?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}

# ---------- Fixed settings (same on every site) ----------

# ---------- JPA / Flyway ----------
spring.jpa.open-in-view=false
# Flyway owns the schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# db/migration/postgresql or db/migration/mysql, chosen from the JDBC URL
spring.flyway.locations=classpath:db/migration/{vendor}

# ---------- Sessions ----------
spring.session.timeout=${SESSION_TIMEOUT:8h}
# tables are created by Flyway
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=SPRING_SESSION
spring.threads.virtual.enabled=true

# ---------- Server ----------
# Tomcat's RemoteIpValve: X-Forwarded-For is only trusted from internal proxies (the Next.js
# server, a load balancer on a private network), so clients can't fake their IP for rate limits.
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.name=KITEPOST_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-form-post-size=1MB

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.kitepost=INFO

# ---------- Kitepost ----------
kitepost.run-workers=${RUN_WORKERS:true}
kitepost.seed-sample=${SEED_SAMPLE_DATA:false}
kitepost.simulate-replies=${SIMULATE_REPLIES:true}
# Public address of the deployed app, e.g. https://kitepost.example.com. Used for the open-tracking image; blank = no tracking.
kitepost.public-url=${PUBLIC_URL:}

# Finding companies (blank provider = demo data)
kitepost.search.provider=${SEARCH_PROVIDER:}
kitepost.search.brave-key=${BRAVE_API_KEY:}
kitepost.search.serpapi-key=${SERPAPI_KEY:}
kitepost.search.google-key=${GOOGLE_CSE_KEY:}
kitepost.search.google-cx=${GOOGLE_CSE_CX:}
kitepost.search.results-per-query=${RESULTS_PER_QUERY:10}

# Classifying and writing (blank key = keyword rules and templates)
kitepost.ai.api-key=${ANTHROPIC_API_KEY:}
kitepost.ai.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}

# Reading websites
kitepost.fetch.timeout-ms=${FETCH_TIMEOUT_MS:12000}
kitepost.fetch.user-agent=${FETCH_USER_AGENT:KitepostBot/1.0 (+lead research; contact via your website)}
kitepost.fetch.concurrency=${PIPELINE_CONCURRENCY:3}
kitepost.fetch.respect-robots=${RESPECT_ROBOTS:true}

# Sending
kitepost.smtp.host=${SMTP_HOST:}
kitepost.smtp.port=${SMTP_PORT:587}
kitepost.smtp.ssl=${SMTP_SSL:false}
kitepost.smtp.user=${SMTP_USER:}
kitepost.smtp.pass=${SMTP_PASS:}
# The From address of every email. Blank = the SMTP login (SMTP_USER) when that is an email address.
# Replies are directed to the reply mailbox (IMAP_USER) below.
kitepost.smtp.from=${SMTP_FROM:}
kitepost.sending.dry-run=${DRY_RUN:true}
kitepost.sending.interval-seconds=${SEND_INTERVAL_SECONDS:30}
kitepost.sending.daily-limit=${DAILY_SEND_LIMIT:100}

# Reply tracking
kitepost.imap.host=${IMAP_HOST:}
kitepost.imap.port=${IMAP_PORT:993}
kitepost.imap.ssl=${IMAP_SSL:true}
kitepost.imap.user=${IMAP_USER:}
kitepost.imap.pass=${IMAP_PASS:}
kitepost.imap.mailbox=${IMAP_MAILBOX:INBOX}
kitepost.imap.poll-seconds=${IMAP_POLL_SECONDS:120}

# Security
kitepost.security.admin-email=${ADMIN_EMAIL:}
kitepost.security.admin-password=${ADMIN_PASSWORD:}
kitepost.security.cookie-secure=${COOKIE_SECURE:true}
kitepost.security.login-max-failures=${LOGIN_MAX_FAILURES:5}
kitepost.security.lockout-minutes=${LOGIN_LOCKOUT_MINUTES:15}
kitepost.security.login-attempts-per-minute=${LOGIN_ATTEMPTS_PER_MINUTE:10}
kitepost.security.allowed-origins=${ALLOWED_ORIGINS:}
# Encrypts the mailbox passwords saved in Settings (AES-256-GCM). A long random value; keep it. Blank = passwords can't be saved.
kitepost.security.encryption-key=${MAIL_ENCRYPTION_KEY:}
